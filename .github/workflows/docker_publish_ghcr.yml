name: build & push docker image to GHCR

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            dockerfile: Dockerfile
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: l4t/l4t.Dockerfile

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/hiroishida/detic_ros:latest-${{ matrix.arch }}
            ghcr.io/hiroishida/detic_ros:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            INSTALL_JSK_PCL=true
            KEEP_LAUNCH_FILES=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/hiroishida/detic_ros:latest \
            ghcr.io/hiroishida/detic_ros:latest-amd64 \
            ghcr.io/hiroishida/detic_ros:latest-arm64

      - name: Create & push multi-arch manifest (sha)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/hiroishida/detic_ros:${{ github.sha }} \
            ghcr.io/hiroishida/detic_ros:${{ github.sha }}-amd64 \
            ghcr.io/hiroishida/detic_ros:${{ github.sha }}-arm64
